[package]
name = "screen_control"
version = "0.2.3"
edition = "2024"
authors = ["Jack Wills <email@mrjackwills.com>"]
description = "Toggle the screen power"
rust-version = "1.97.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unused_async = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
module_name_repetitions = "allow"
doc_markdown = "allow"

[dependencies]
async-channel = "2.5"
dotenvy = "0.15"
futures-util = "0.3"
jiff = "0.2"
local-ip-address = "0.6"
mimalloc = "0.1"
reqwest = { version = "0.13", default-features = false, features = [
	"brotli",
	"gzip",
	"json",
	"default-tls"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simple-signal = "1.1"
sudo = "0.6"
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
debug = false
opt-level = 2
